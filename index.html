<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會考會不會考會 - 暑假作業展</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; 
        }

        /* 主視覺容器：設定背景圖 */
        .container {
            position: relative;
            width: 1920px; /* 請依據您 Canva 下載的實際像素調整 */
            height: 1080px; 
            background-image: url('background.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            max-width: 100vw;
            max-height: 100vh;
        }

        /* 圖片播放框：使用絕對定位覆蓋在背景圖的指定位置 */
        .photo-frame {
            position: absolute;
            /* ⚠️ 這裡的 top, left, width, height 需要根據您的灰色八角形邊框位置進行數值微調 */
            top: 26%;   
            left: 50%;
            transform: translateX(-50%); /* 確保水平置中 */
            width: 32%;  
            height: 60%; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* 照片本身的樣式 */
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* contain: 完整顯示不裁切；若要填滿框框可改為 cover */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 輪播圖片的顯示區塊 -->
        <div class="photo-frame">
            <img id="slideshow" src="photos/1.jpg" alt="暑假作業展示">
        </div>
    </div>

    <script>
        // 1. 設定您的 GitHub 儲存庫資訊
        const githubUser = 'foredu987-lang'; // GitHub 帳號
        const githubRepo = '2026SW';         // 儲存庫名稱
        const folderPath = 'photos';         // 圖片資料夾名稱
        const displayTime = 3000;            // 切換時間 (3000 = 3秒)

        const apiUrl = `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${folderPath}`;
        const imgElement = document.getElementById('slideshow');
        
        let imageList = [];
        let currentIndex = 0;

        // 2. 透過 GitHub API 自動取得資料夾內的檔案清單
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                // 過濾出圖片檔 (排除非圖片檔案)，並建立清單
                imageList = data
                    .filter(item => item.name.match(/\.(jpg|jpeg|png|gif)$/i))
                    .map(item => item.name);

                if (imageList.length > 0) {
                    // 載入第一張圖片
                    imgElement.src = `photos/${imageList[currentIndex]}`;
                    
                    // 3. 啟動自動輪播
                    setInterval(() => {
                        currentIndex++;
                        if (currentIndex >= imageList.length) {
                            currentIndex = 0;
                        }
                        imgElement.src = `photos/${imageList[currentIndex]}`;
                    }, displayTime);
                } else {
                    console.error("資料夾內找不到圖片檔案");
                }
            })
            .catch(error => console.error("無法取得資料夾內容:", error));
    </script>

</body>
</html>
